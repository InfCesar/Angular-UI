<h2>Calendar</h2>

<div class="control">
  <label>
    Primer día de la semana:
    <select [formControl]="firstDayOfWeek">
      @for (option of options; track option; let i = $index) {
        <option [ngValue]="i">
          {{ option }}
        </option>
      }
    </select>
  </label>
</div>
<div class="control">
  <label>
    Locale:
    <select #localeSelect (change)="alcDateI18n.setLocale(localeSelect.value)">
      @for (option of locales; track option) {
        <option [value]="option" [selected]="option === alcDateI18n.locale()">
          {{ option }}
        </option>
      }
    </select>
  </label>
</div>
<div class="control">
  <label>
    Modo:
    <select [formControl]="mode">
      <option [ngValue]="1">Individual</option>
      <option [ngValue]="2">Rango</option>
    </select>
  </label>
</div>
<div class="calendar-container">
  <div class="controls">
    <button type="button" (click)="prevActiveMonth()">prev</button>
    <button type="button" (click)="nextActiveMonth()">next</button>
  </div>
  <div class="calendar">
    <div class="months">
      @for (month of months(); track trackByMonth($index, month)) {
        <div class="months-col">
          <alc-calendar-month
            [activeDate]="activeDate"
            [month]="month"
            [selected]="selectedDate"
            (selectedChange)="onSelect($event)"
            (activeDateChange)="onActiveDateChange($event)"
            [firstDayOfWeek]="selectedFirstDayOfweek"
          ></alc-calendar-month>
        </div>
      }
    </div>
  </div>
</div>

Selected dates: {{ selectedDates | json }}
