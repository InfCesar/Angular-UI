
<table role="grid" class="month" cellspacing="0" cellpadding="0">
  <caption>{{monthName}} {{year}}</caption>
  <thead>
    <tr>
      <th
        *ngFor="let weekDay of firstDayOfWeek | monthHeader"
        scope="col"
      >
        <span class="ui-visually-hidden">{{weekDaysNames[weekDay].long}}</span>
        <span aria-hidden="true">
          {{weekDaysNames[weekDay].short}}
        </span>
      </th>
    </tr>
  </thead>
  <tbody class="dates">
    <tr *ngFor="let week of month | monthBody : firstDayOfWeek; let i = index; trackBy: trackWeeksBy" class="month-row">
      <td
        *ngIf="i === 0 && (7 - week.length) as daysFromPreviousMonth"
        [attr.colspan]="daysFromPreviousMonth"
      >
      </td>
      <ng-container *ngFor="let day of week; trackBy: trackDaysBy">
        @let dayState = day | dayState: selected : activeDate;
        <td
          class="day"
          (click)="selectDay(day)"
          (keydown.space)="selectDay(day)"
          (keydown.enter)="selectDay(day)"
          [attr.aria-selected]="dayState[DayStateField.selected]"
          [attr.tabindex]="dayState[DayStateField.active] ? '0' : '-1'"
          [ngClass]="dayState"
        >
          <span class="day-content">
            {{day.dayNumber}}
          </span>
        </td>
      </ng-container>
    </tr>
  </tbody>
</table>
