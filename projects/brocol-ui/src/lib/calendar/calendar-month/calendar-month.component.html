
<table role="grid" class="month" cellspacing="0" cellpadding="0">
  <caption>{{monthsNames[currentMonth]}} {{currentYear}}</caption>
  <thead>
    <tr>
      <th
        *ngFor="let weekDay of weekDaysNames | monthHeader : firstDayOfWeek"
      >
        {{ weekDay }}
      </th>
    </tr>
  </thead>
  <tbody class="dates">
    <tr *ngFor="let week of monthIndex | monthBody : year : firstDayOfWeek; let i = index" class="month-row">
      <td
        *ngIf="i === 0 && (7 - week.length) as daysFromPreviousMonth"
        [attr.colspan]="daysFromPreviousMonth"
      >
      </td>
      <td
        *ngFor="let day of week; trackBy: trackDaysBy"
      >
        <button
          ui-button
          (click)="selectDay(day)"
          [ngClass]="day | dayState: selected"
        >
          {{day.dayNumber}}
        </button>
      </td>
    </tr>
  </tbody>
</table>
